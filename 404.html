<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3E7">
<meta name="robots" content="noindex, follow">
<title>Página no encontrada · Dulce Estación</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="preload" href="/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/playfair-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/estilos.css?v=71">
<style>
  .error404{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; gap:0; }
  .error404__numero{ font-family:var(--f-marca); font-size:clamp(5rem,18vw,9rem); color:var(--rojo); line-height:1; margin:2rem 0 .25rem; }
  .error404__titulo{ font-family:var(--f-title); font-size:clamp(1.6rem,5vw,2.4rem); margin-bottom:1rem; }
  .error404__txt{ color:var(--gris); max-width:36rem; margin:0 auto 2rem; }
  .error404__cta{ display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<main class="error404">
  <a href="/" class="logo" aria-label="Dulce Estación"><span class="logo__d">dulce</span><span class="logo__e">estacion</span></a>
  <div class="error404__numero">404</div>
  <h1 class="error404__titulo">Esta página no existe</h1>
  <p class="error404__txt">La dirección que buscaste no está en nuestro sitio. Puede que el enlace esté desactualizado o que hayas escrito mal la dirección.</p>
  <div class="error404__cta">
    <a href="/" class="btn btn--lg">Volver al inicio</a>
    <a href="/#servicios" class="btn btn--ghost btn--lg">Ver servicios</a>
  </div>
</main>
</body>
</html>
